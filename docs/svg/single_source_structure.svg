<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" font-family="sans-serif">
<title>단일 출처 구조 — SKILL.md · 6개 검증 에이전트 · pre-commit 스캐너</title>
<desc>SKILL.md를 중심으로 5개 검증 서브에이전트(sp-convention-validator, table-lock-order-auditor, race-condition-checker, batch-lifecycle-auditor, security-audit-agent)는 실행 시점마다 Glob/Read로 SKILL.md 해당 절 원문을 직접 읽어 판정 기준으로 삼는다. agent-router는 SKILL.md를 직접 읽지 않고 이 5개 에이전트 파일의 description만 실행 시점에 읽어 추천에 쓴다. pre-commit-privacy-scan.js는 LLM이 아닌 순수 Node 스크립트로, SKILL.md 15장 기준을 코드로 이미 구현해뒀기 때문에 실행 시점에 SKILL.md를 다시 읽지 않는다.</desc>
<rect x="0" y="0" width="1180" height="420" fill="#FFFFFF"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
  </marker>
</defs>

<!-- SKILL.md -> 5 validators (실제로 원문을 읽는 경로) -->
<line x1="560" y1="76" x2="120" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="560" y1="76" x2="340" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="560" y1="76" x2="560" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="560" y1="76" x2="780" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="560" y1="76" x2="1000" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="565" y="100" font-size="12" fill="#5F5E5A">실행 시점마다 Glob/Read (해당 절)</text>

<!-- agent-router -> 5 validators (description만 참조, SKILL.md 미참조) -->
<line x1="560" y1="260" x2="120" y2="196" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<line x1="560" y1="260" x2="340" y2="196" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<line x1="560" y1="260" x2="560" y2="196" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<line x1="560" y1="260" x2="780" y2="196" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<line x1="560" y1="260" x2="1000" y2="196" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
<text x="565" y="246" font-size="12" fill="#5F5E5A">description만 Read (SKILL.md 미참조)</text>

<!-- SKILL.md -> pre-commit script: 실행 시점 재참조 없음, 별도 경로로 명확히 구분 -->
<line x1="660" y1="48" x2="940" y2="48" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="2,4" marker-end="url(#arrow)"/>
<text x="672" y="38" font-size="12" fill="#5F5E5A">15장 기준 구현 · 실행 시점 재참조 없음</text>

